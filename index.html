<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="google-site-verification" content="D6prsuEHzGdHbu50KLcQvr6tq4my_wtdg0Db48lYAUI" />
    <title>Chengcheng Song 宋乘成</title>
    <meta name="author" content="Chengcheng Song">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="images/favicon/happy.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="stylesheet.css">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f9f9f9;
        color: #333;
      }
      
      .container {
        text-align: center;
        max-width: 600px;
        padding: 2rem;
        border-radius: 10px;
        background-color: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      }
      
      .avatar {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 4px solid #fff;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      
      h1 {
        margin: 0 0 1rem 0;
        font-size: 2.2rem;
        font-weight: 500;
      }
      
      .subtitle {
        color: #666;
        margin-bottom: 2rem;
      }
      
      .language-selector {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 30px;
      }
      
      .language-btn {
        padding: 12px 30px;
        font-size: 1rem;
        background-color: #ffffff;
        color: #2196F3;
        border: 2px solid #2196F3;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
      }
      
      .language-btn:hover {
        background-color: #2196F3;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(33, 150, 243, 0.3);
      }
      
      .language-btn:active {
        transform: translateY(0);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="images/chengchengsong.png" alt="Chengcheng Song" class="avatar">
      <h1>Chengcheng Song 宋乘成</h1>
      <p class="subtitle">欢迎访问我的个人网站 / Welcome to my personal website</p>
      
      <div class="language-selector">
        <a href="zh.html" class="language-btn" onclick="setLanguagePreference('zh')">
          <i class="fas fa-globe-asia"></i> 中文
        </a>
        <a href="en.html" class="language-btn" onclick="setLanguagePreference('en')">
          <i class="fas fa-globe-americas"></i> English
        </a>
      </div>
    </div>
    
    <script>
      // 自动根据浏览器语言设置跳转到相应页面
      document.addEventListener('DOMContentLoaded', function() {
        const userLang = navigator.language || navigator.userLanguage;
        // 如果有cookie记录了用户的语言选择，则优先使用
        const savedLang = getCookie('preferredLanguage');
        
        if (savedLang) {
          window.location.href = savedLang === 'zh' ? 'zh.html' : 'en.html';
        } else if (userLang.startsWith('zh')) {
          window.location.href = 'zh.html';
        } else {
          window.location.href = 'en.html';
        }
      });
      
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }
      
      function setLanguagePreference(lang) {
        document.cookie = `preferredLanguage=${lang}; path=/; max-age=${60*60*24*365}`;
      }
    </script>
  </body>
</html>
